name: Build SyncLink Android APK

on:
  push:
    branches:
      - synclink-v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: synclink
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare and verify APK
        shell: bash
        run: |
          cp synclink/app/build/outputs/apk/debug/app-debug.apk SyncLink-v0.2.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose SyncLink-v0.2.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging SyncLink-v0.2.apk | head -n 12
          sha256sum SyncLink-v0.2.apk > SyncLink-v0.2.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncLink-v0.2-Android
          path: |
            SyncLink-v0.2.apk
            SyncLink-v0.2.sha256
          retention-days: 30
