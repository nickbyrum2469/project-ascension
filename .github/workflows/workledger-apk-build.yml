name: Build WorkLedger v1.2 APK

on:
  push:
    branches: [workledger-apk-build]
    paths:
      - 'workledger-build-v12/**'
      - '.github/workflows/workledger-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify WorkLedger source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/workledger-src
          cat workledger-build-v12/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/workledger.tar.xz
          xz -t /tmp/workledger.tar.xz
          tar -xJf /tmp/workledger.tar.xz -C /tmp/workledger-src
          test -f /tmp/workledger-src/android/app/build.gradle
          test -f /tmp/workledger-src/android/app/src/main/AndroidManifest.xml
          test -f /tmp/workledger-src/android/app/src/main/assets/app.js
          grep -q "versionName '1.2.0'" /tmp/workledger-src/android/app/build.gradle
          grep -q "2026-08-28T08:00" /tmp/workledger-src/android/app/src/main/assets/app.js
          grep -q "linked-rate pay engine" /tmp/workledger-src/android/app/src/main/assets/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile release APK
        working-directory: /tmp/workledger-src/android
        run: gradle assembleRelease --stacktrace

      - name: Package unsigned APK and official signing tools
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/workledger-src/android/app/build/outputs/apk/release/app-release-unsigned.apk WorkLedger-v1.2-unsigned.apk
          mkdir -p android-sign-tools/lib android-sign-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-sign-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-sign-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" android-sign-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-sign-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" android-sign-tools/lib64/
          chmod +x android-sign-tools/apksigner android-sign-tools/zipalign android-sign-tools/aapt2
          LD_LIBRARY_PATH="$PWD/android-sign-tools/lib64" android-sign-tools/zipalign -c -v 4 WorkLedger-v1.2-unsigned.apk || true
          zip -qr Android-signing-tools.zip android-sign-tools
          unzip -t WorkLedger-v1.2-unsigned.apk
          sha256sum WorkLedger-v1.2-unsigned.apk Android-signing-tools.zip

      - name: Upload WorkLedger build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkLedger-v1.2-Unsigned-And-Tools
          path: |
            WorkLedger-v1.2-unsigned.apk
            Android-signing-tools.zip
          if-no-files-found: error
          retention-days: 30
