name: Build WorkLedger APK

on:
  push:
    branches: [workledger-apk-build]
    paths:
      - 'workledger-build-v11/**'
      - '.github/workflows/workledger-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct WorkLedger Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/workledger-src
          cat workledger-build-v11/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/workledger.tar.xz
          tar -xJf /tmp/workledger.tar.xz -C /tmp/workledger-src
          test -f /tmp/workledger-src/android/app/build.gradle
          test -f /tmp/workledger-src/android/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        working-directory: /tmp/workledger-src/android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp /tmp/workledger-src/android/app/build/outputs/apk/debug/app-debug.apk WorkLedger-v1.1.apk
          sha256sum WorkLedger-v1.1.apk

      - name: Upload WorkLedger APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkLedger-v1.1-APK
          path: WorkLedger-v1.1.apk
          if-no-files-found: error
          retention-days: 30
