plugins {
    id 'com.android.application'
}

android {
    namespace 'com.synclink.audio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.synclink.audio'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.4.0'
    }

    signingConfigs {
        stableDebug {
            def keyPath = System.getenv('SYNCLINK_KEYSTORE') ?: "${System.properties['user.home']}/.synclink-signing/synclink.jks"
            storeFile file(keyPath)
            storePassword 'synclink-dev'
            keyAlias 'synclink'
            keyPassword 'synclink-dev'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            signingConfig signingConfigs.stableDebug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
